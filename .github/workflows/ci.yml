name: CI

# Every pull request targeting Extended has to go through this workflow, and it also
# runs on Extended itself so the branch always has a known-good status.
on:
  push:
    branches:
      - Extended
  pull_request:
    branches:
      - Extended
  workflow_dispatch:

permissions:
  contents: read

# Only keep the newest run per pull request; pushes to Extended always run to completion.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  SOLUTION: DotNetProjects.Wpf.Extended.Toolkit.sln
  TEST_PROJECT: Src/Xceed.Wpf.Toolkit.Tests/DotNetProjects.Wpf.Extended.Toolkit.Tests.csproj

jobs:
  build:
    name: Build and test
    # WPF and the net4 target can only be built on Windows.
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Compute build version
        shell: pwsh
        run: |
          # Mirrors the AppVeyor scheme: 5.0.<incrementing build number>.
          $version = "5.0.$env:GITHUB_RUN_NUMBER"
          "BUILD_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Building version $version"

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: >
          dotnet build ${{ env.SOLUTION }}
          --configuration Release
          --no-restore
          -p:Version=${{ env.BUILD_VERSION }}
          -p:AssemblyVersion=${{ env.BUILD_VERSION }}.0
          -p:FileVersion=${{ env.BUILD_VERSION }}.0
          -p:ContinuousIntegrationBuild=true

      - name: Test
        run: >
          dotnet test ${{ env.TEST_PROJECT }}
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results/**/*.trx
          if-no-files-found: warn

      - name: Collect packages
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/packages | Out-Null
          Get-ChildItem -Path Src -Recurse -File |
            Where-Object { $_.Extension -in '.nupkg', '.snupkg' -and $_.FullName -like '*\bin\Release\*' } |
            Copy-Item -Destination artifacts/packages

      - name: Upload binaries
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ env.BUILD_VERSION }}
          # One folder per target framework, mirroring the build output.
          path: |
            Src/Xceed.Wpf.Toolkit/bin/Release/**/DotNetProjects.*.dll
            Src/Xceed.Wpf.Toolkit/bin/Release/**/DotNetProjects.*.pdb
            Src/Xceed.Wpf.DataGrid/bin/Release/**/DotNetProjects.*.dll
            Src/Xceed.Wpf.DataGrid/bin/Release/**/DotNetProjects.*.pdb
          if-no-files-found: error

      - name: Upload packages
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ env.BUILD_VERSION }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
